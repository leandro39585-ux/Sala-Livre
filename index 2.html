:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6fb;--card:#fff;--tx:#14213d;--mut:#55627a;--nav:#0b2447;--bd:#d5deec;--ok:#0a6b36;--okb:#dff5e8;--ko:#a8201a;--kob:#fde4e2;--wa:#8a4300;--wab:#ffe9d1;--gr:#3f4756;--grb:#e5e7eb;--pr:#1d5fd1;--inf:#0b4a9e;--infb:#e1edff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1526;--card:#16213a;--tx:#e8eefb;--mut:#a4b1cb;--nav:#07132b;--bd:#2c3d63;--ok:#6fe0a0;--okb:#123a28;--ko:#ff9c94;--kob:#43191a;--wa:#ffc07a;--wab:#43290b;--gr:#cbd2dd;--grb:#2f3747;--pr:#6aa2ff;--inf:#9cc3ff;--infb:#1b2c4f}}
:root[data-theme=dark]{--bg:#0d1526;--card:#16213a;--tx:#e8eefb;--mut:#a4b1cb;--nav:#07132b;--bd:#2c3d63;--ok:#6fe0a0;--okb:#123a28;--ko:#ff9c94;--kob:#43191a;--wa:#ffc07a;--wab:#43290b;--gr:#cbd2dd;--grb:#2f3747;--pr:#6aa2ff;--inf:#9cc3ff;--infb:#1b2c4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:.2em 0}h2{font-size:1.5rem}h3{font-size:1.05rem}.mut{color:var(--mut);margin:.2em 0}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{background:var(--nav);color:#fff;padding:14px 10px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
nav.side .logo{font-weight:800;font-size:1.25rem;padding:6px 10px 14px}
nav.side button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;color:#dbe7ff;padding:10px;border-radius:8px;font:inherit;cursor:pointer}
nav.side button:hover,nav.side button[aria-current=page]{background:#1b3e75;color:#fff}
main{padding:18px;max-width:1100px;width:100%;outline:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.num{font-size:2rem;font-weight:800;color:var(--pr)}
.chip{display:inline-block;background:var(--infb);color:var(--inf);border-radius:20px;padding:1px 9px;font-size:.8rem;margin:2px 3px 2px 0}
.bd{display:inline-block;border-radius:6px;padding:2px 9px;font-size:.82rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.s-Livre,.s-Aprovada,.s-Resolvido,.s-Concluída{color:var(--ok);background:var(--okb)}
.s-Ocupada,.s-Urgente,.s-Rejeitada,.s-Alto{color:var(--ko);background:var(--kob)}
.s-Reservada,.s-Pendente,.s-Médio,.s-Recebido{color:var(--wa);background:var(--wab)}
.s-Em\ manutenção,.s-Em\ análise,.s-Em\ resolução,.s-Baixo{color:var(--inf);background:var(--infb)}
.s-Indisponível,.s-Cancelada{color:var(--gr);background:var(--grb)}
button,select,input,textarea{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f5a524;outline-offset:2px}
.b1,.b2,.b3{border-radius:8px;padding:8px 14px;cursor:pointer;border:2px solid var(--pr);font-weight:600}
.b1{background:var(--pr);color:#fff}.b2{background:none;color:var(--pr)}.b3{background:none;border-color:var(--ko);color:var(--ko)}
label{display:block;font-weight:600;margin:8px 0 3px}input,select,textarea{width:100%;padding:8px;border:1px solid var(--mut);border-radius:8px;background:var(--card);color:var(--tx)}
input[type=checkbox]{width:auto;margin-right:6px}.cb{font-weight:400;display:inline-block;margin-right:14px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}

function validate(b,ign){const E=[],r=room(b.room);if(!r)E.push('Escolha uma sala.');if(!b.date||!b.s||!b.e)E.push('Indique a data e o horário.');else{if(mins(b.e)<=mins(b.s))E.push('A hora de fim tem de ser posterior à hora de início.');if(isPast(b.date,b.s))E.push('Não é possível reservar no passado.')}

function qr(id){let h=0;for(const c of id+'sl')h=(h*31+c.charCodeAt(0))>>>0;let s='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);let on;if(f){const a=x>12?x-14:x,b=y>12?y-14:y;on=a>=0&&b>=0&&a<7&&b<7&&(a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5))}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return`<svg viewBox="-1 -1 23 23" width="130" role="img" aria-label="Código QR ilustrativo da sala ${id}"><rect x="-1" y="-1" width="23" height="23" fill="#fff"/><g fill="#000">${s}</g></svg>`}

nova(){const d={date:TM,s:'14:00',e:'15:30',n:'',room:'',reason:'',group:'',obs:'',eq:[],...S.draft};return`<h2>${d.id?'Editar reserva':'Nova reserva'}</h2><form class="card" onsubmit="return saveRes(event)"><div class="fg"><div><label for="r">Sala</label><select id="r" name="room" required><option value="">Escolha…</option>${S.rooms.map(r=>`<option value="${r.id}" ${d.room===r.id?'selected':''}>${r.id} — ${r.type} (${r.cap})</option>`).join('')}</select></div><div><label for="d">Data</label><input id="d" name="date" type="date" value="${d.date}" required></div><div><label for="s">Hora de início</label><input id="s" name="s" type="time" value="${d.s}" required></div><div><label for="e">Hora de fim</label><input id="e" name="e" type="time" value="${d.e}" required></div><div><label for="g">Turma ou grupo</label><input id="g" name="group" value="${esc(d.group)}"></div><div><label for="n">Participantes</label><input id="n" name="n" type="number" min="1" value="${d.n}"></div></div><label for="m">Motivo da reserva</label><input id="m" name="reason" value="${esc(d.reason)}"><fieldset style="border:0;padding:0"><legend><b>Equipamentos necessários</b></legend>${EQ.map(e=>`<label class="cb"><input type="checkbox" name="eq" value="${e}" ${d.eq.includes(e)?'checked':''}>${e}</label>`).join('')}</fieldset><label for="o">Observações</label><textarea id="o" name="obs" rows="2">${esc(d.obs)}</textarea><p><button class="b1" type="submit">✅ ${d.id?'Guardar alterações':'Confirmar reserva'}</button></p></form>`},
minhas(){return resPage(S.res.filter(r=>r.u===S.u.id),'As minhas reservas')},
todas(){return resPage(S.res,'Todas as reservas',1)},
problemas(){const mine=S.iss.filter(i=>i.u===S.u.id);return`<h2>Comunicar problema</h2><form class="card" onsubmit="return saveIss(event)"><div class="fg"><div><label for="r">Sala</label><select id="r" name="room" required>${S.rooms.map(r=>`<option ${S.draft.room===r.id?'selected':''}>${r.id}</option>`).join('')}</select></div><div><label for="c">Categoria</label><select id="c" name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="u">Grau de urgência</label><select id="u" name="urg">${['Baixo','Médio','Alto','Urgente'].map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="p">Fotografia (opcional)</label><input id="p" name="photo" type="file" accept="image/*"></div></div><label for="ds">Descrição</label><textarea id="ds" name="desc" rows="3"></textarea><p><button class="b1" type="submit">📨 Enviar comunicação</button></p></form><h3 style="margin-top:14px">Os meus problemas</h3>${issTable(mine)}`},
manut(){return`<h2>Manutenção</h2><div class="grid">${kpi('Pendentes',S.iss.filter(i=>i.st!=='Resolvido').length)}${kpi('Urgentes',S.iss.filter(i=>i.st!=='Resolvido'&&i.urg==='Urgente').length)}</div><h3 style="margin-top:14px">Problemas comunicados</h3>${issTable(S.iss,1)}<h3 style="margin-top:14px">Estado das salas</h3><div class="tw"><table><caption class="mut" style="text-align:left">Bloquear ou colocar em manutenção</caption><tr><th>Sala</th><th>Estado</th><th>Alterar</th></tr>${S.rooms.map(r=>`<tr><td>${r.id}</td><td>${bd(rs(r))}</td><td><label class="cb" for="st${r.id}" style="display:none">Estado ${r.id}</label><select id="st${r.id}" onchange="setRoom('${r.id}',this.value);R()"><option value="auto" ${r.st==='auto'?'selected':''}>Automático (livre)</option><option ${r.st==='Em manutenção'?'selected':''}>Em manutenção</option><option ${r.st==='Indisponível'?'selected':''}>Indisponível</option></select></td></tr>`).join('')}</table></div>`},
mapa(){return`<h2>Mapa da escola</h2><p>${Object.keys(ICON).map(s=>bd(s)).join(' ')}</p><div class="map">${[...new Set(S.rooms.map(r=>r.b))].map(b=>`<div class="tile"><b>Bloco ${b}</b>${S.rooms.filter(r=>r.b===b).map(r=>{const s=rs(r);return`<button class="s-${s}" onclick="S.sel='${r.id}';S.cd=T;R()" aria-label="Sala ${r.id}, ${s}">${ICON[s]} ${r.id} · ${s}</button>`}).join('')}</div>`).join('')}</div>`},
notif(){const l=S.not.filter(n=>n.u===S.u.id);return`<div class="row"><h2>Notificações</h2><button class="b2" onclick="l=S.not.forEach(n=>n.u===S.u.id&&(n.r=1));R()">Marcar como lidas</button></div>${l.map(n=>`<div class="card" style="margin:8px 0">${n.r?'':'<span class="bd s-Médio">Nova</span> '}${esc(n.t)}</div>`).join('')||'<p>Sem notificações.</p>'}`},
stats(){const live_=S.res.filter(live),per=S.rooms.map(r=>[r.id,live_.filter(x=>x.room===r.id).length]).sort((a,b)=>b[1]-a[1]),cat={};S.iss.forEach(i=>cat[i.cat]=(cat[i.cat]||0)+1);return`<h2>Estatísticas</h2><div class="grid">${kpi('Total de salas',S.rooms.length)}${kpi('Problemas comunicados',S.iss.length)}${kpi('Tempo médio de resolução','1,8 dias')}${kpi('Taxa média de utilização','62%')}</div><div class="grid" style="margin-top:14px"><div class="card"><h3>Salas mais utilizadas</h3>${bars(per.slice(0,4))}</div><div class="card"><h3>Salas menos utilizadas</h3>${bars(per.slice(-3).reverse())}</div><div class="card"><h3>Horários de maior ocupação</h3>${bars([['08–10',14],['10–12',22],['12–14',9],['14–16',19],['16–18',11]])}</div><div class="card"><h3>Reservas por semana</h3>${bars([['Sem. 1',34],['Sem. 2',41],['Sem. 3',38],['Atual',S.res.length+30]])}</div><div class="card"><h3>Equipamentos com mais avarias</h3>${bars(Object.entries(cat))}</div></div>`},
users(){return`<h2>Utilizadores</h2><div class="tw"><table><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr>${S.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${{P:'Professor',F:'Funcionário',A:'Administrador'}[u.role]}</td></tr>`).join('')}</table></div>`},
def(){return`<h2>Definições</h2><div class="card"><label class="cb"><input type="checkbox" ${S.cfg.gap?'checked':''} onchange="S.cfg.gap=this.checked">Exigir intervalo mínimo de 15 minutos entre reservas</label><br><label class="cb"><input type="checkbox" ${S.cfg.appr?'checked':''} onchange="S.cfg.appr=this.checked">Reservas de professores precisam de aprovação</label></div>`}};
const bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(([l,v])=>`<div class="bar"><span>${l}</span><i style="width:${v/m*100}%" role="img" aria-label="${l}: ${v}"></i><b>${v}</b></div>`).join('')};
function search(e){e.preventDefault();const fd_=new FormData(e.target);S.f.pq={date:fd_.get('date'),s:fd_.get('s'),e:fd_.get('e'),n:+fd_.get('n'),type:fd_.get('type'),b:fd_.get('b'),eq:fd_.getAll('eq')};S.f.pr=1;if(mins(S.f.pq.e)<=mins(S.f.pq.s)||isPast(S.f.pq.date,S.f.pq.s)){S.f.pr=0;toast('e',['Indique um horário válido e futuro (fim depois do início).'])}else S.msg=null;R();return false}
function saveRes(e){e.preventDefault();const f=new FormData(e.target),b={room:f.get('room'),date:f.get('date'),s:f.get('s'),e:f.get('e'),group:f.get('group'),n:+f.get('n'),reason:f.get('reason'),obs:f.get('obs'),eq:f.getAll('eq')},id=S.draft.id,E=validate(b,id);S.draft={...b,id};if(E.length){toast('e',E);R();return false}
if(id){Object.assign(S.res.find(r=>r.id===id),b);toast('o',`Reserva atualizada: ${b.room}, ${fd(b.date)}, ${b.s}–${b.e}.`)}else{const st=S.u.role==='P'&&S.cfg.appr?'Pendente':'Aprovada';S.res.push({id:Date.now(),...b,u:S.u.id,st});notify(S.u.id,`A sua reserva da sala ${b.room} ${st==='Aprovada'?'foi aprovada':'está pendente de aprovação'}.`);toast('o',`Reserva confirmada · Sala ${b.room} · ${fd(b.date)} · ${b.s}–${b.e} · Motivo: ${b.reason} · Responsável: ${S.u.name} · Estado: ${st}`)}

function resPage(list,t,staff){const f=S.f.rs||'';const l=list.filter(r=>!f||eff(r)===f).sort((a,b)=>(b.date+b.s).localeCompare(a.date+a.s));return`<h2>${t}</h2><label for="fr">Filtrar por estado</label><select id="fr" style="max-width:240px" onchange="S.f.rs=this.value;R()"><option value="">Todos</option>${['Aprovada','Pendente','Cancelada','Rejeitada','Concluída'].map(s=>`<option ${f===s?'selected':''}>${s}</option>`).join('')}</select><div class="tw" style="margin-top:10px"><table><tr><th>Sala</th><th>Data</th><th>Horário</th><th>Motivo</th><th>Responsável</th><th>Estado</th><th>Ações</th></tr>${l.map(r=>{const s=eff(r),can=(r.u===S.u.id||S.u.role==='A')&&live(r);return`<tr><td>${r.room}</td><td>${fd(r.date)}</td><td>${r.s}–${r.e}</td><td>${esc(r.reason)}<br><small class="mut">${esc(r.group)} · ${r.n} pessoas</small></td><td>${user(r.u).name}</td><td>${bd(s)}</td><td>${can?`<button class="b2" onclick="S.draft={...S.res.find(x=>x.id===${r.id}),id:${r.id}};go('nova')">Editar</button> <button class="b3" onclick="cancel(${r.id})">Cancelar</button>`:''}${S.u.role==='A'&&s==='Pendente'?` <button class="b1" onclick="decide(${r.id},'Aprovada')">Aprovar</button> <button class="b3" onclick="decide(${r.id},'Rejeitada')">Rejeitar</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7">Sem reservas.</td></tr>'}</table></div>`}

function decide(id,st){const r=S.res.find(x=>x.id===id);r.st=st;notify(r.u,`A sua reserva da sala ${r.room} foi ${st==='Aprovada'?'aprovada':'rejeitada'}.`);R()}

function issTable(l,staff){return`<div class="tw"><table><tr><th>Sala</th><th>Categoria</th><th>Urgência</th><th>Comunicado</th><th>Estado</th>${staff?'<th>Responsável</th><th>Observações internas</th>':''}</tr>${l.map(i=>`<tr><td>${i.room}</td><td>${i.cat}<br><small class="mut">${esc(i.desc)}</small></td><td>${bd(i.urg)}</td><td>${fd(i.date)}<br><small>${user(i.u).name}</small></td><td>${staff?`<select aria-label="Estado do problema na sala ${i.room}" onchange="setIss(${i.id},this.value)">${['Recebido','Em análise','Em resolução','Resolvido'].map(s=>`<option ${i.st===s?'selected':''}>${s}</option>`).join('')}</select>`:bd(i.st)}</td>${staff?`<td>${esc(i.resp||'—')}</td><td><input aria-label="Observações internas" value="${esc(i.obs)}" onchange="S.iss.find(x=>x.id===${i.id}).obs=this.value"></td>`:''}</tr>`).join('')||'<tr><td colspan="7">Sem problemas.</td></tr>'}</table></div>`}
